gate1_decision_statement: >-
  The canonical Pass 3 hepatocellular package is the intended successor to the legacy
  S24 ALT-high authority. ALT above the laboratory reference range must produce the
  canonical general ALT-high context even when r_value_alt_alp cannot be calculated.
  R-value eligibility governs only biochemical-pattern refinement. Missing ALT, ALP,
  either laboratory ULN, or eligible pairing must fail closed only for the R-value-specific
  classification and must not suppress recognition of elevated ALT.

