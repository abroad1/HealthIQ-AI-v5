  evidence_gaps:
  - isolated ALP cannot distinguish hepatobiliary from bone origin
  - GGT, bilirubin, calcium, phosphate, vitamin D, history, pregnancy, age and imaging
    may be absent
  - canonical source combines biliary and bone interpretation in one frame
  - legacy WHY can emit hepatobiliary language without a ratified GGT concordance
