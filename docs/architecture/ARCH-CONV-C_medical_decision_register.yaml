liver_injury_axis:
  authority_group_id: liver_injury_axis
  source: knowledge_bus/governance/signal_authority_collision_model_v1.yaml
  current_status: placeholder_not_adjudicated
  biological_axis: hepatocellular_injury
  primary_signal_family: signal_alp_high
  supporting_signal_families:
  - signal_ggt_high
  collision_policy:
    no_duplicate_user_facing_signal: true
    suppress_supporting_when_primary_present: true
    consolidate_into_shared_interpretation: true
    allow_parallel_if_distinct_risk_layer: false
  runtime_action: apply_explicit_concordance_policy
  requires_runtime_support: true
  policy_decision: APPROVE_WITH_NARROWING
  medical_authority_decision: ALP_PRIMARY_ONLY_WHEN_CONCORDANT_GGT_GGT_SUPPORTING_NON_CAUSAL
  head_of_medical_research_reference: ARCH-CONV-C-GATE1-HMR-2026-07-30
  anthony_ratification_reference: ARCH-CONV-C-GATE2-ANTHONY-2026-07-30
  required_questions:
  - whether ALP or GGT can ever be primary authority
  - whether one or both remain supporting or context-only
  - whether ALP and GGT concordance is required for hepatobiliary or cholestatic causality
  - how discordant high ALP with normal GGT behaves
  - how discordant high GGT with normal ALP behaves
  - how bone-turnover, alcohol and enzyme-induction contexts are represented
  - how future ALT and bilirubin authority can join without displacement or pre-decision
  - whether all four collision fields become explicit booleans or a richer governed
    policy
  recommended_biological_axis: cholestatic_source_axis
  concordance_policy:
    alp_high_and_ggt_high: Emit one consolidated cholestatic/hepatobiliary biochemical-pattern
      finding. ALP is primary causal-candidate authority; GGT is supporting context
      only.
    alp_high_and_ggt_normal: Suppress hepatobiliary causal WHY. Emit ALP as non-specific
      source context, preserving bone and other non-hepatic possibilities.
    alp_high_and_ggt_missing: 'Fail closed identically to discordant/unknown source:
      no hepatobiliary causal WHY.'
    ggt_high_and_alp_normal: Emit GGT context only; suppress cholestatic causal WHY
      and all alcohol/medicine attribution.
    ggt_high_and_alp_missing: Emit GGT context only; no hepatobiliary causal WHY.
  bilirubin_role: Supporting severity/excretory context only. Bilirubin is not required
    for basic ALP+GGT cholestatic-pattern eligibility and gains no WHY authority under
    ARCH-CONV-C.
  future_boundary: ALT and hyperbilirubinemia remain excluded and retain independent
    future authority. ARCH-CONV-C must not alias, suppress, retire, or pre-adjudicate
    either family.
  gate2_status: RATIFIED
