  gate1_questions:
  - whether this combined canonical frame is medically acceptable or requires narrowing
  - whether ALP alone can ever support causal WHY
  - whether high GGT is required for hepatobiliary interpretation
  - whether bilirubin is required for cholestatic escalation
  - how missing source-attribution data must fail closed
  gate1_conditions:
  - The frame may describe a possible cholestatic/hepatobiliary biochemical pattern
    only when ALP and GGT are both high.
  - It must not diagnose obstruction, cholangitis, primary biliary cholangitis, primary
    sclerosing cholangitis, malignancy, or another specific liver disease.
  - Isolated ALP elevation, normal GGT, or unavailable GGT must fail closed to non-specific
    source context and must not emit hepatobiliary causal WHY.
  - Normal or unavailable GGT preserves bone, placental, intestinal, physiological,
    and other non-hepatic source possibilities.
  - Bilirubin may strengthen severity or excretory context but is not required for
    basic cholestatic-pattern eligibility and must not confer a specific diagnosis.
  - Calcium, phosphate, vitamin D, PTH, age, pregnancy, bone history, symptoms, serial
    results, isoenzymes, and imaging remain supporting or missing-data context only.
  - The frame must not diagnose high bone turnover or any specific bone disorder from
    ALP alone.
  gate2_status: RATIFIED
