gate1_decision_statement: >-
  Complete remaining ALT contextual authority from canonical Pass 3 without inventing
  medical thresholds. Cholestatic R<=2 activates as subordinate ALT biochemical-pattern
  context (not ALP/GGT source primary). Muscle and metabolic activate lab-only with
  mandatory pre-emission corroboration gates. Bilirubin severity is override/escalation
  on active ALT frames only. User-context corroboration and very-high-ALT numeric
  suppress remain unresolved blockers (lab paths proceed). signal_alt_high is not added
  as liver_injury_axis supporting family because named-key filtering would drop
  hepatocellular/mixed or family-level suppress would suppress all ALT when ALP primary
  is present.

