    Canonical ALP is the sole primary candidate and becomes causal only with
    high-GGT concordance. Canonical GGT remains context-only and is consolidated
    under ALP when both fire. Deferred Pass 3 activation keys are non-authoritative.
    Under ARCH-CONV-E3 Gate 1, ALT cholestatic R<=2 may emit as a subordinate ALT
    biochemical-pattern context, but signal_alt_high is intentionally NOT listed as
    a supporting_signal_family here because named activation-key filtering would drop
    hepatocellular/mixed, and family-level suppress would suppress all ALT when ALP
    primary is present. ALP/GGT remains sole primary for cholestatic SOURCE.
    Activation-key-level suppress of only the cholestatic ALT key when ALP primary
    is present is deferred pending a collision-contract extension work package.
