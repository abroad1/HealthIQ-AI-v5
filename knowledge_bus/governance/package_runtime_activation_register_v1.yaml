# Governed runtime activation register (ARCH-CONV-E / ARCH-CONV-E2).
#
# Placement of a package under knowledge_bus/packages/ does NOT activate it. A
# non-launch-critical frame is production-reachable only if its activation_key is
# listed in activated_frames below. Launch-critical (pkg_kb47_*) packages keep their
# own lineage-based eligibility contract and are deliberately out of this register.
register_id: package_runtime_activation_register_v1
version: 1.1.0
work_id: ARCH-CONV-E2
authority_scope: non_launch_critical_packages
activation_unit: activation_key
activation_key_contract: "signal_id::source_spec_id (ADR-RT-002)"
derivation: >-
  ARCH-CONV-E baseline-parity snapshot, updated by ARCH-CONV-E2 to activate the two
  R-value ALT pattern frames with Pass 3 band gates, supersede pkg_s24_alt_high_hepatocellular_injury,
  and keep the remaining four ARCH-CONV-E ALT packages withheld with explicit reasons.
promotion_contract: >-
  A new or regenerated frame stays inert until a governed promotion work package appends
  its activation_key. Changing a package source_spec_id changes its activation_key and
  therefore requires re-promotion.
withheld_reason_arch_conv_e2: >-
  Four ARCH-CONV-E ALT packages remain withheld: cholestatic R-value (duplicates ALP/GGT
  cholestatic_source_axis); muscle, bilirubin severity, and metabolic/MASLD (missing
  distinguishing pre-emission gates that would otherwise duplicate ALT primary on every
  ALT-high panel). Former Batch 5 inferred keys remain superseded and must not be reactivated.

