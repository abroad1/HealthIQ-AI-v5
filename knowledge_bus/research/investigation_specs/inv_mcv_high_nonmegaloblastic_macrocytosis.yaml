investigation_spec_contract_version: 3.0.0
spec_id: inv_mcv_high_nonmegaloblastic_macrocytosis
signal_id: signal_mcv_high
research_domain: hematologic
primary_marker:
  biomarker_id: mcv
  rationale: High MCV can occur in non-megaloblastic states and should not automatically be equated with folate or B12 deficiency.
  signal_system: hematologic
trigger_direction: high
activation:
  activation_logic: lab_range_exceeded
  activation_config:
    enable_upper_bound: true
    upper_bound_state: suboptimal
    enable_lower_bound: false
    lower_bound_state: suboptimal
states:
  baseline_state: suboptimal
  escalation_state: at_risk
supporting_markers:
- biomarker_id: ggt
  expected_direction: high
  role: differential_marker
  relationship_kind: differential
  availability: common
  rationale: High GGT supports alcohol-related or hepatic macrocytosis as an alternative to megaloblastic deficiency.
- biomarker_id: alt
  expected_direction: high
  role: corroborator
  relationship_kind: corroboration
  availability: common
  rationale: Elevated ALT can support concurrent hepatocellular injury or steatotic liver context.
- biomarker_id: folate
  expected_direction: low
  role: differential_marker
  relationship_kind: differential
  availability: common
  rationale: Low folate supports a competing megaloblastic explanation and weakens a purely non-megaloblastic interpretation.
hypotheses:
- hypothesis_id: hyp_alcohol_or_hepatic_macrocytosis
  rank: 1
  physiological_claim: High MCV with elevated GGT or liver enzymes may reflect alcohol-related or hepatic non-megaloblastic macrocytosis.
  evidence_strength: strong
  caveats:
  - This interpretation remains non-specific and does not identify the exact hepatic diagnosis.
  missing_data:
    policy: Review liver enzymes, alcohol exposure, and hematinic markers before assigning a non-megaloblastic explanation.
  supporting_marker_refs:
  - ggt
  - alt
  - folate
  contradiction_markers:
  - contradiction_id: ctr_low_folate_mcv_nonmeg
    marker_reference: folate
    contradiction_rationale: Low folate weakens a purely non-megaloblastic interpretation and raises a megaloblastic contribution.
    contradiction_strength: strong
- hypothesis_id: hyp_other_nonmegaloblastic_macrocytosis
  rank: 2
  physiological_claim: High MCV may also reflect other non-megaloblastic causes such as reticulocytosis, hypothyroidism, or marrow disorders when hematinic deficiency is not supported.
  evidence_strength: strong
  caveats:
  - This is a broader differential frame and typically requires additional testing beyond routine chemistry.
  missing_data:
    policy: If liver and hematinic markers are not explanatory, broaden the differential rather than forcing an alcohol-related interpretation.
  supporting_marker_refs:
  - ggt
  - folate
  contradiction_markers:
  - contradiction_id: ctr_high_ggt_specificity
    marker_reference: ggt
    contradiction_rationale: A high GGT supports hepatic or alcohol-related context and weakens the need to prioritise other non-megaloblastic causes first.
    contradiction_strength: weak
hypothesis_ranking:
  ordered_hypothesis_ids:
  - hyp_alcohol_or_hepatic_macrocytosis
  - hyp_other_nonmegaloblastic_macrocytosis
confirmatory_tests:
- test_id: ct_liver_panel_review
  rationale: Liver-pattern review helps clarify whether macrocytosis sits within a hepatic or alcohol-related context.
- test_id: ct_b12_and_folate_panel
  rationale: Hematinic testing helps exclude a megaloblastic cause before non-megaloblastic frames are prioritised.
override_rules:
- rule_id: or_mcv_high_with_high_ggt
  resulting_state: at_risk
  description: Escalate when MCV is high and GGT is also high because the combination supports a persistent non-megaloblastic hepatic or alcohol-related context.
  conditions:
  - metric_id: ggt
    operator: '>'
    condition_type: all_of
    comparator_type: lab_range_boundary
    boundary: above_max
  source_refs:
  - source_macrocytosis_review
evidence:
  evidence_strength: strong
  sources:
  - source_id: source_macrocytosis_review
    paper_title: Macrocytosis evaluation and megaloblastic versus non-megaloblastic causes
    journal: Hematology review literature
    year: 2025
  physiological_claim: High MCV with liver-enzyme or alcohol-related context may reflect non-megaloblastic macrocytosis rather than hematinic deficiency.
  threshold_notes: The trigger remains the laboratory abnormality rather than a disease-specific numeric threshold.
narrative:
  mechanism: Alcohol exposure, liver disease, reticulocytosis, hypothyroidism, and marrow disorders can produce macrocytosis without classic megaloblastic change.
  biological_pathway: GGT and ALT help provide hepatic or alcohol-related context, while normal hematinic markers weaken megaloblastic explanations.
  interpretation: High MCV in this pattern is a useful differential clue rather than a diagnosis on its own.
  implications: This pattern may justify liver and exposure review before pursuing isolated folate-only explanations.
  supporting_marker_roles: GGT is the key differential marker, ALT corroborates liver context, and folate helps exclude megaloblastic deficiency.
