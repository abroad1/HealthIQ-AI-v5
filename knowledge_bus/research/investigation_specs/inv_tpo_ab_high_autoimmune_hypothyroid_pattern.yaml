investigation_spec_contract_version: 3.0.0
spec_id: inv_tpo_ab_high_autoimmune_hypothyroid_pattern
signal_id: signal_tpo_ab_high
research_domain: endocrine
primary_marker:
  biomarker_id: tpo_ab
  rationale: TPO antibodies are a clinically established marker of thyroid autoimmunity and are most informative when interpreted with thyroid function tests.
  signal_system: endocrine
trigger_direction: high
activation:
  activation_logic: lab_range_exceeded
  activation_config:
    enable_upper_bound: true
    upper_bound_state: suboptimal
    enable_lower_bound: false
    lower_bound_state: suboptimal
states:
  baseline_state: suboptimal
  escalation_state: at_risk
supporting_markers:
- biomarker_id: tsh
  expected_direction: high
  role: corroborator
  relationship_kind: corroboration
  availability: common
  rationale: Raised TSH supports evolving or established primary thyroid failure in the setting of thyroid autoimmunity.
- biomarker_id: free_t4
  expected_direction: low
  role: severity_marker
  relationship_kind: severity
  availability: common
  rationale: Low free T4 helps distinguish overt thyroid hormone deficiency from antibody positivity without current biochemical failure.
- biomarker_id: free_t3
  expected_direction: high
  role: differential_marker
  relationship_kind: differential
  availability: common
  rationale: A hyperthyroid hormone pattern would redirect interpretation away from an autoimmune hypothyroid frame toward a stimulatory or destructive thyrotoxic process.
- biomarker_id: tgab
  expected_direction: high
  role: corroborator
  relationship_kind: corroboration
  availability: common
  rationale: Concurrent thyroglobulin antibody positivity strengthens the interpretation that the antibody signal sits within broader thyroid autoimmunity.
hypotheses:
- hypothesis_id: hyp_autoimmune_primary_hypothyroid_pattern
  rank: 1
  physiological_claim: High TPO antibodies with a primary hypothyroid biochemical pattern are consistent with autoimmune thyroiditis as a common cause of thyroid failure.
  evidence_strength: strong
  caveats:
  - Antibody positivity supports autoimmunity but does not by itself establish current severity without thyroid function results.
  missing_data:
    policy: Interpret TPO antibody elevation alongside TSH and free T4 before assigning active thyroid failure physiology.
  supporting_marker_refs:
  - tsh
  - free_t4
  - tgab
  contradiction_markers:
  - contradiction_id: ctr_hyperthyroid_hormone_pattern
    marker_reference: free_t3
    contradiction_rationale: High free T3 would weaken a hypothyroid failure frame and suggest a different autoimmune or destructive thyroid process.
    contradiction_strength: strong
- hypothesis_id: hyp_subclinical_autoimmune_thyroid_failure
  rank: 2
  physiological_claim: High TPO antibodies may identify autoimmune thyroid injury before free T4 falls, particularly when TSH is already above the reference range.
  evidence_strength: strong
  caveats:
  - The transition from antibody positivity to overt hypothyroidism is variable and should not be assumed from antibodies alone.
  missing_data:
    policy: If free T4 is unavailable, keep interpretation at a subclinical or evolving thyroid failure level rather than assuming overt hypothyroidism.
  supporting_marker_refs:
  - tsh
  - tgab
  contradiction_markers:
  - contradiction_id: ctr_preserved_free_t4_without_tsh_rise
    marker_reference: free_t4
    contradiction_rationale: Normal free T4 without TSH elevation weakens interpretation as active autoimmune hypothyroid physiology and supports a preclinical frame instead.
    contradiction_strength: moderate
hypothesis_ranking:
  ordered_hypothesis_ids:
  - hyp_autoimmune_primary_hypothyroid_pattern
  - hyp_subclinical_autoimmune_thyroid_failure
confirmatory_tests:
- test_id: ct_repeat_thyroid_function_panel
  rationale: Repeat TSH and free T4 help confirm whether antibody positivity is accompanied by stable thyroid failure or evolving dysfunction.
- test_id: ct_thyroid_ultrasound
  rationale: Thyroid ultrasound can support autoimmune thyroiditis when biochemical or antibody patterns are present but the clinical picture remains uncertain.
override_rules:
- rule_id: or_tpo_ab_high_with_primary_hypothyroid_pattern
  resulting_state: at_risk
  description: Escalate when high TPO antibodies coexist with raised TSH and low free T4, as this combination is more consistent with active autoimmune thyroid failure than isolated antibody positivity.
  conditions:
  - metric_id: tsh
    operator: '>'
    condition_type: all_of
    comparator_type: lab_range_boundary
    boundary: above_max
  - metric_id: free_t4
    operator: <
    condition_type: all_of
    comparator_type: lab_range_boundary
    boundary: below_min
  source_refs:
  - source_tpo_nice_hypothyroid_context
  - source_tpo_ata_hashimoto
evidence:
  evidence_strength: strong
  sources:
  - source_id: source_tpo_nice_hypothyroid_context
    paper_title: NICE guideline on thyroid disease assessment and management
    journal: NICE guideline NG145
    year: 2019
  - source_id: source_tpo_ata_hashimoto
    paper_title: American Thyroid Association Hashimoto's Thyroiditis patient guidance
    journal: American Thyroid Association
    year: 2023
  physiological_claim: TPO antibody positivity supports autoimmune thyroid disease and is clinically useful when primary hypothyroid biochemistry is present.
  threshold_notes: Interpretation should remain anchored to the reporting laboratory reference range; antibody positivity alone should not be converted into an independent disease-severity threshold.
narrative:
  mechanism: TPO antibodies reflect autoimmune targeting of thyroid peroxidase and support immune-mediated thyroid injury rather than a non-thyroidal cause of abnormal thyroid function.
  biological_pathway: Thyroid autoimmunity with lymphocytic inflammation, impaired hormone synthesis, compensatory TSH rise, and eventual thyroid hormone failure when functional reserve declines.
  interpretation: High TPO antibodies are most clinically informative when paired with TSH elevation and reduced free T4, because that pattern supports autoimmune thyroiditis as a likely driver of primary hypothyroid physiology.
  implications: This pattern may justify confirmation of persistent dysfunction, review for autoimmune thyroid disease, and follow-up of thyroid function rather than treating antibody positivity as a stand-alone diagnosis.
  supporting_marker_roles: TSH corroborates primary thyroid failure, free T4 grades biochemical severity, free T3 helps redirect away from a hypothyroid frame when hyperthyroid physiology is present, and TgAb adds corroborating autoimmune context.
