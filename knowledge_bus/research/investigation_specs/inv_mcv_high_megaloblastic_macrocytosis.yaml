investigation_spec_contract_version: 3.0.0
spec_id: inv_mcv_high_megaloblastic_macrocytosis
signal_id: signal_mcv_high
research_domain: hematologic
primary_marker:
  biomarker_id: mcv
  rationale: MCV reflects average erythrocyte size and high values indicate macrocytosis, not a specific diagnosis by themselves.
  signal_system: hematologic
trigger_direction: high
activation:
  activation_logic: lab_range_exceeded
  activation_config:
    enable_upper_bound: true
    upper_bound_state: suboptimal
    enable_lower_bound: false
    lower_bound_state: suboptimal
states:
  baseline_state: suboptimal
  escalation_state: at_risk
supporting_markers:
- biomarker_id: folate
  expected_direction: low
  role: mechanism_marker
  relationship_kind: mechanism
  availability: common
  rationale: Low folate supports megaloblastic macrocytosis from impaired DNA synthesis.
- biomarker_id: active_b12
  expected_direction: low
  role: corroborator
  relationship_kind: corroboration
  availability: common
  rationale: Low active B12 supports a cobalamin-related megaloblastic contribution.
- biomarker_id: ggt
  expected_direction: high
  role: differential_marker
  relationship_kind: differential
  availability: common
  rationale: High GGT supports an alcohol-related or hepatic non-megaloblastic alternative to hematinic deficiency.
hypotheses:
- hypothesis_id: hyp_megaloblastic_macrocytosis
  rank: 1
  physiological_claim: High MCV with low folate or low active B12 is consistent with megaloblastic macrocytosis from impaired DNA synthesis.
  evidence_strength: strong
  caveats:
  - Macrocytosis can occur without anemia and does not by itself distinguish folate from B12 deficiency.
  missing_data:
    policy: Review folate and active B12 together before assigning a megaloblastic cause.
  supporting_marker_refs:
  - folate
  - active_b12
  - ggt
  contradiction_markers:
  - contradiction_id: ctr_high_ggt_mcv
    marker_reference: ggt
    contradiction_rationale: A high GGT weakens a purely megaloblastic interpretation and raises alcohol-related or hepatic macrocytosis as an alternative.
    contradiction_strength: moderate
- hypothesis_id: hyp_combined_or_b12_predominant_macrocytosis
  rank: 2
  physiological_claim: High MCV may also reflect a cobalamin-predominant or combined hematinic deficiency pattern rather than isolated folate deficiency alone.
  evidence_strength: strong
  caveats:
  - Additional functional markers may be needed where the B12 distinction matters clinically.
  missing_data:
    policy: Do not assume folate deficiency is sole cause if active B12 is low or borderline.
  supporting_marker_refs:
  - active_b12
  - folate
  contradiction_markers:
  - contradiction_id: ctr_normal_active_b12_mcv
    marker_reference: active_b12
    contradiction_rationale: Normal active B12 weakens a cobalamin-predominant explanation for macrocytosis.
    contradiction_strength: moderate
hypothesis_ranking:
  ordered_hypothesis_ids:
  - hyp_megaloblastic_macrocytosis
  - hyp_combined_or_b12_predominant_macrocytosis
confirmatory_tests:
- test_id: ct_b12_and_folate_panel
  rationale: Parallel hematinic testing helps distinguish the cause of macrocytosis.
- test_id: ct_peripheral_blood_film
  rationale: Blood-film review can help identify megaloblastic change and other macrocytic patterns.
override_rules:
- rule_id: or_mcv_high_with_low_active_b12
  resulting_state: at_risk
  description: Escalate when MCV is high and active B12 is low because the combination supports clinically relevant megaloblastic macrocytosis rather than isolated macrocytosis of uncertain cause.
  conditions:
  - metric_id: active_b12
    operator: <
    condition_type: all_of
    comparator_type: lab_range_boundary
    boundary: below_min
  source_refs:
  - source_macrocytosis_review
evidence:
  evidence_strength: strong
  sources:
  - source_id: source_macrocytosis_review
    paper_title: Macrocytosis evaluation and megaloblastic versus non-megaloblastic causes
    journal: Hematology review literature
    year: 2025
  physiological_claim: High MCV commonly reflects macrocytosis from B12 or folate deficiency, alcohol-related change, liver disease, hypothyroidism, reticulocytosis, or marrow disorders.
  threshold_notes: The deterministic trigger is the laboratory abnormality; cause assignment depends on accompanying hematinic and liver markers.
narrative:
  mechanism: Macrocytosis arises from impaired DNA synthesis, altered membrane composition, reticulocytosis, or marrow dysplasia.
  biological_pathway: Folate and active B12 help identify megaloblastic causes, while GGT or liver enzymes help distinguish non-megaloblastic hepatic or alcohol-related macrocytosis.
  interpretation: High MCV is clinically useful because it narrows anemia interpretation even when hemoglobin remains normal.
  implications: This pattern may justify hematinic and liver review before assuming marrow disease.
  supporting_marker_roles: Folate and active B12 are the main mechanism markers, while GGT helps as a differential for non-megaloblastic macrocytosis.
