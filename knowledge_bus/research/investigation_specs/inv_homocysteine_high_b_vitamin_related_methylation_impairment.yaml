investigation_spec_contract_version: 3.0.0
spec_id: inv_homocysteine_high_b_vitamin_related_methylation_impairment
signal_id: signal_homocysteine_high
research_domain: metabolic
primary_marker:
  biomarker_id: homocysteine
  rationale: Homocysteine is a methylation-pathway intermediate and rises most commonly with folate, B12, or B6 insufficiency, renal impairment, or genetic pathway variation.
  signal_system: metabolic
trigger_direction: high
activation:
  activation_logic: lab_range_exceeded
  activation_config:
    enable_upper_bound: true
    upper_bound_state: suboptimal
    enable_lower_bound: false
    lower_bound_state: suboptimal
states:
  baseline_state: suboptimal
  escalation_state: at_risk
supporting_markers:
- biomarker_id: folate
  expected_direction: low
  role: mechanism_marker
  relationship_kind: mechanism
  availability: common
  rationale: Low folate supports impaired remethylation as a common cause of elevated homocysteine.
- biomarker_id: active_b12
  expected_direction: low
  role: differential_marker
  relationship_kind: differential
  availability: common
  rationale: Low active B12 supports an alternative or combined cobalamin-related cause of hyperhomocysteinemia.
- biomarker_id: mcv
  expected_direction: high
  role: corroborator
  relationship_kind: corroboration
  availability: common
  rationale: Macrocytosis supports a clinically relevant hematinic consequence of impaired one-carbon metabolism.
hypotheses:
- hypothesis_id: hyp_folate_related_hyperhomocysteinemia
  rank: 1
  physiological_claim: High homocysteine may reflect folate-related impairment of remethylation, particularly when folate is low and macrocytic change is present.
  evidence_strength: strong
  caveats:
  - Homocysteine is not specific for folate deficiency and can rise in several other contexts.
  missing_data:
    policy: Review folate and B12 markers together before attributing elevated homocysteine to folate alone.
  supporting_marker_refs:
  - folate
  - mcv
  - active_b12
  contradiction_markers:
  - contradiction_id: ctr_normal_folate_hcy
    marker_reference: folate
    contradiction_rationale: Normal folate weakens folate deficiency as the leading explanation for elevated homocysteine.
    contradiction_strength: moderate
- hypothesis_id: hyp_b12_related_or_combined_methylation_impairment
  rank: 2
  physiological_claim: High homocysteine may also reflect cobalamin deficiency or combined B-vitamin insufficiency, especially when active B12 is low.
  evidence_strength: strong
  caveats:
  - Additional markers such as methylmalonic acid may be needed where B12-specific confirmation is important.
  missing_data:
    policy: Assess active B12 before assuming folate deficiency is the sole explanation.
  supporting_marker_refs:
  - active_b12
  - folate
  - mcv
  contradiction_markers:
  - contradiction_id: ctr_normal_active_b12_hcy
    marker_reference: active_b12
    contradiction_rationale: Normal active B12 weakens a primary cobalamin-deficiency explanation.
    contradiction_strength: moderate
hypothesis_ranking:
  ordered_hypothesis_ids:
  - hyp_folate_related_hyperhomocysteinemia
  - hyp_b12_related_or_combined_methylation_impairment
confirmatory_tests:
- test_id: ct_b12_and_folate_panel
  rationale: Parallel B12 and folate testing helps distinguish the most likely remethylation defect.
- test_id: ct_methylmalonic_acid
  rationale: Methylmalonic acid can help clarify whether cobalamin deficiency is contributing to elevated homocysteine.
override_rules:
- rule_id: or_homocysteine_high_with_low_active_b12
  resulting_state: at_risk
  description: Escalate when homocysteine is high and active B12 is low because the combination supports a clinically relevant cobalamin-related methylation defect.
  conditions:
  - metric_id: active_b12
    operator: <
    condition_type: all_of
    comparator_type: lab_range_boundary
    boundary: below_min
  source_refs:
  - source_homocysteine_review
evidence:
  evidence_strength: strong
  sources:
  - source_id: source_homocysteine_review
    paper_title: Homocysteine in folate and cobalamin deficiency
    journal: Nutrition and hematology review literature
    year: 2025
  physiological_claim: High homocysteine commonly reflects impaired remethylation or transsulfuration, most often in a B-vitamin deficiency context.
  threshold_notes: Interpretation should remain lab-range anchored and integrated with B12, folate, and renal context.
narrative:
  mechanism: Homocysteine rises when one-carbon metabolism is limited or when renal clearance is reduced.
  biological_pathway: Folate and active B12 provide the main mechanistic context, while MCV can support clinically relevant megaloblastic consequence.
  interpretation: High homocysteine is biologically informative but not disease-specific on its own.
  implications: This pattern may justify hematinic and renal review rather than isolated cardiovascular interpretation from homocysteine alone.
  supporting_marker_roles: Folate and active B12 are core mechanism markers, while MCV helps corroborate whether the disturbance has hematologic expression.
