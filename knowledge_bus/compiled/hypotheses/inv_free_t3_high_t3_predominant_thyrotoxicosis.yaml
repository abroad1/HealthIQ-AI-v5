hypotheses:
- hypothesis_id: hyp_t3_predominant_thyroid_hormone_excess_pattern
  rank: 1
  title: T3-predominant thyroid-hormone excess pattern
  physiological_claim: High free T3 with suppressed TSH and free T4 not elevated is compatible with a T3-predominant thyroid-hormone excess pattern, without assigning a specific disease label or cause.
  evidence_strength: moderate
  missing_data_policy: Interpret only when free T3 is high, TSH is suppressed, and free T4 is not elevated on the same panel.
  evidence_for:
  - Free T3 is above the laboratory range.
  - TSH is below the laboratory range.
  - Free T4 is not above the laboratory range.
  evidence_against:
  - A non-suppressed TSH weakens ordinary thyrotoxic interpretation.
  - High free T4 redirects toward the broader FT4-high thyrotoxicosis lane.
  contradiction_markers: []
  caveats:
  - Do not label this frame as hyperthyroidism or Graves' disease.
  - Do not recommend treatment or medication adjustment.
  - Review medication, thyroid-hormone use, antithyroid treatment, recent illness, pregnancy, biotin, and assay interference where available.
  confirmatory_tests: []
  summary_template: High free T3 with low TSH and no FT4 elevation can fit a T3-predominant thyroid-hormone excess pattern. This does not by itself identify the cause or confirm thyroid disease.
provenance:
  artefact_kind: compiled_hypothesis_v1
  compile_status: compile_pipeline
  notes: ARCH-CONV-A Wave 1 Gate 1 / Gate 2 ratified compiled WHY artefact. T3-predominant lane only.
