hypotheses:
- hypothesis_id: hyp_primary_thyroid_hormone_deficiency_pattern
  rank: 1
  title: Primary thyroid-hormone-deficiency pattern
  physiological_claim: Low free T4 with elevated TSH is compatible with a primary thyroid-hormone-deficiency pattern, without confirming hypothyroidism or assigning cause from this panel alone.
  evidence_strength: moderate
  missing_data_policy: Interpret only when free T4 is low and TSH is elevated on the same panel.
  evidence_for:
  - Free T4 is below the laboratory range.
  - TSH is above the laboratory range.
  evidence_against:
  - Low or inappropriately normal TSH redirects away from ordinary primary-deficiency WHY.
  contradiction_markers: []
  caveats:
  - Do not label this frame as hypothyroidism or pituitary disease.
  - Do not recommend treatment or medication adjustment.
  - Review medication, recent illness, pregnancy, biotin, and assay interference where available.
  confirmatory_tests: []
  summary_template: Low free T4 with high TSH can fit a primary thyroid-hormone-deficiency pattern. This panel alone does not confirm thyroid disease or identify the cause.
