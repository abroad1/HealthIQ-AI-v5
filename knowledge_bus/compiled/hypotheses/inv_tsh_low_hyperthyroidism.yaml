hypotheses:
- hypothesis_id: hyp_low_tsh_subclinical_thyroid_context
  rank: 1
  title: Low-TSH thyroid-axis context
  physiological_claim: Low TSH with free T4 and free T3 still within range can represent a low-TSH or subclinical thyroid-dysfunction context, without confirming hyperthyroidism from this panel alone.
  evidence_strength: moderate
  missing_data_policy: Interpret only when TSH is low and both free T4 and free T3 are present but not low or high on the same panel.
  evidence_for:
  - TSH is below the laboratory range.
  - Free T4 remains within the laboratory range.
  - Free T3 remains within the laboratory range.
  evidence_against:
  - Elevated free T4 or free T3 redirects toward overt thyrotoxicosis-compatible frames.
  - Low free T4 makes ordinary hyperthyroid WHY inappropriate on this panel.
  contradiction_markers: []
  caveats:
  - Do not label this frame as hyperthyroidism, Graves' disease, or pituitary disease.
  - Do not recommend treatment or medication adjustment.
  - Review medication, thyroid-hormone use, antithyroid treatment, recent illness, pregnancy, biotin, and assay interference where available.
  confirmatory_tests: []
  summary_template: A low TSH with free T4 and free T3 still in range can reflect thyroid-axis strain or subclinical dysfunction context. This pattern does not by itself confirm thyroid disease.
