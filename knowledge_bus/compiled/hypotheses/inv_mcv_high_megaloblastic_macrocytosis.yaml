hypotheses:
- evidence_strength: moderate
  evidence_for:
  - MCV is elevated.
  - Folate or B12 markers support a nutrient-associated pattern when present.
  evidence_against:
  - B12 and folate markers are replete.
  contradiction_markers: []
  caveats:
  - Do not diagnose megaloblastic anaemia without appropriate haematological evidence.
  - Do not assume isolated folate deficiency when B12 status is unknown.
  confirmatory_tests: []
  missing_data_policy: Interpret only with the governed supporting markers and clinical
    context available on this panel.
  hypothesis_id: hyp_megaloblastic_macrocytosis
  rank: 1
  title: Megaloblastic-pattern macrocytosis differential
  physiological_claim: Raised MCV with corroborating folate or B12 insufficiency may
    fit a megaloblastic-pattern differential without diagnosing megaloblastic anaemia
    from biochemistry alone.
  summary_template: The combination of larger red cells and low or borderline folate/B12
    markers may fit a vitamin-related macrocytosis pattern. Other causes remain possible.
- evidence_strength: moderate
  evidence_for:
  - MCV elevated with B12-related marker support.
  evidence_against:
  - No B12/folate support.
  contradiction_markers: []
  caveats:
  - Do not infer the underlying cause of B12 or folate deficiency from this frame.
  confirmatory_tests: []
  missing_data_policy: Interpret only with the governed supporting markers and clinical
    context available on this panel.
  hypothesis_id: hyp_combined_or_b12_predominant_macrocytosis
  rank: 2
  title: B12-predominant or combined nutrient macrocytosis pattern
  physiological_claim: B12 insufficiency or combined B12/folate limitation may contribute
    to macrocytosis when supporting markers are present.
  summary_template: The combination of larger red cells and low or borderline folate/B12
    markers may fit a vitamin-related macrocytosis pattern. Other causes remain possible.
