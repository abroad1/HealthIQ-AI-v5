hypotheses:
- hypothesis_id: hyp_urea_non_specific_renal_hydration_protein_context
  rank: 1
  title: Non-specific urea context
  physiological_claim: Elevated urea may provide non-specific context involving renal
    clearance, hydration, protein intake, or catabolic influences, without establishing
    renal impairment or a single causal explanation.
  evidence_strength: contextual
  missing_data_policy: Interpret as context only. Creatinine or eGFR concordance may
    strengthen renal context but cannot establish a diagnosis. Dehydration, protein
    intake, catabolic illness, corticosteroid exposure, and gastrointestinal bleeding
    remain differential or contextual possibilities only.
  evidence_for:
  - Urea is above the laboratory range.
  - High creatinine or low eGFR may strengthen non-specific renal-clearance context when present.
  evidence_against:
  - Isolated urea elevation is non-specific and may reflect hydration, protein intake, or catabolic influences.
  - Low haemoglobin must not be treated as evidence that gastrointestinal bleeding is present.
  contradiction_markers: []
  caveats:
  - Do not emit standalone causal renal-impairment WHY from isolated urea.
  - Do not diagnose renal failure or gastrointestinal bleeding from this frame.
  - Do not silently merge renal, prerenal, catabolic, corticosteroid, or bleeding concepts into one causal claim.
  - Creatinine or eGFR concordance may strengthen context but does not establish diagnosis.
  - Do not recommend treatment from this frame.
  confirmatory_tests: []
  summary_template: Urea is above range and may reflect non-specific renal-clearance, hydration, protein, or catabolic context. It does not establish renal impairment or gastrointestinal bleeding.
provenance:
