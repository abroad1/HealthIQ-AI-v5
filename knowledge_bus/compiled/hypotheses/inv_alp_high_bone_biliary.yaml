hypotheses:
- hypothesis_id: hyp_alp_conditional_cholestatic_source_context
  rank: 1
  title: Conditional ALP source context
  physiological_claim: Elevated ALP is not tissue-specific. Concurrent high GGT may
    support a possible cholestatic or hepatobiliary biochemical pattern, while normal
    or unavailable GGT preserves bone and other non-hepatic source possibilities.
  evidence_strength: strong
  missing_data_policy: High GGT is required for hepatobiliary causal-candidate
    eligibility. If GGT is normal or unavailable, retain non-specific ALP source
    context only and preserve bone, placental, intestinal, physiological, and other
    non-hepatic possibilities.
  evidence_for:
  - ALP is above the laboratory range.
  - Concurrent high GGT supports hepatic source attribution and a possible cholestatic biochemical pattern.
  evidence_against:
  - Normal or unavailable GGT prevents hepatobiliary causal WHY from ALP.
  - ALP alone cannot distinguish hepatobiliary from bone or other non-hepatic sources.
  contradiction_markers: []
  caveats:
  - Do not assert obstruction, cholangitis, malignancy, or another specific liver disease.
  - Do not assert high bone turnover or a specific bone disorder from ALP alone.
  - Bilirubin is supporting severity or excretory context only and gains no WHY authority here.
  - Calcium, phosphate, vitamin D, PTH, age, pregnancy, history, symptoms, serial results, isoenzymes, and imaging remain context only.
  - Do not recommend medication, treatment, or imaging from this frame.
  confirmatory_tests: []
  summary_template: ALP is above range. With high GGT, this may support a possible cholestatic or hepatobiliary biochemical pattern; without high GGT, its source remains non-specific.
provenance:
  artefact_kind: compiled_hypothesis_v1
