hypotheses:
- hypothesis_id: hyp_raised_tsh_subclinical_thyroid_context
  rank: 1
  title: Raised-TSH thyroid-axis context
  physiological_claim: Elevated TSH with free T4 still within range can represent a raised-TSH or subclinical thyroid-dysfunction context, without confirming hypothyroidism from this panel alone.
  evidence_strength: moderate
  missing_data_policy: Interpret only when TSH is high and free T4 is present but not low or high on the same panel.
  evidence_for:
  - TSH is above the laboratory range.
  - Free T4 remains within the laboratory range.
  evidence_against:
  - Low free T4 redirects toward the primary thyroid-hormone-deficiency frame.
  - High free T4 makes ordinary hypothyroid WHY inappropriate on this panel.
  contradiction_markers: []
  caveats:
  - Do not label this frame as hypothyroidism, Hashimoto's disease, or pituitary disease.
  - Do not recommend treatment or medication adjustment.
  - Review medication, thyroid-hormone use, recent illness, pregnancy, biotin, and assay interference where available.
  confirmatory_tests: []
  summary_template: A raised TSH with free T4 still in range can reflect thyroid-axis strain or subclinical dysfunction context. This pattern does not by itself confirm thyroid disease.
