hypotheses:
- evidence_strength: moderate
  evidence_for:
  - TPO antibodies raised with elevated TSH and reduced FT4.
  evidence_against:
  - FT4 preserved or TSH not elevated.
  contradiction_markers: []
  caveats:
  - Positive TPO antibodies are not alone proof of current hypothyroidism.
  - Do not imply antibody titre measures severity.
  - Do not prescribe treatment from this frame.
  confirmatory_tests: []
  missing_data_policy: Interpret only with the governed supporting markers and clinical
    context available on this panel.
  hypothesis_id: hyp_autoimmune_primary_hypothyroid_pattern
  rank: 1
  title: Autoimmune primary hypothyroid physiology pattern
  physiological_claim: Elevated TSH with reduced FT4 plus raised TPO antibodies may
    support an autoimmune contribution to primary hypothyroid physiology without diagnosing
    Hashimoto thyroiditis from blood alone.
  summary_template: Raised thyroid peroxidase antibodies, together with this thyroid-function
    pattern, may support an autoimmune contribution. The antibodies alone do not show
    how well the thyroid is currently functioning.
- evidence_strength: moderate
  evidence_for:
  - TPO antibodies raised with elevated TSH and FT4 within range.
  evidence_against:
  - TSH not elevated or overt low FT4 pattern present.
  contradiction_markers: []
  caveats:
  - Preserve overt versus subclinical distinctions; do not diagnose from antibodies
    alone.
  confirmatory_tests: []
  missing_data_policy: Interpret only with the governed supporting markers and clinical
    context available on this panel.
  hypothesis_id: hyp_subclinical_autoimmune_thyroid_failure
  rank: 2
  title: Subclinical autoimmune thyroid failure pattern
  physiological_claim: Elevated TSH with FT4 within range plus raised TPO antibodies
    may support a subclinical autoimmune thyroid pattern.
  summary_template: Raised thyroid peroxidase antibodies, together with this thyroid-function
    pattern, may support an autoimmune contribution. The antibodies alone do not show
    how well the thyroid is currently functioning.
