hypotheses:
- evidence_strength: moderate
  evidence_for:
  - MCV elevated with supportive hepatic marker or alcohol-context evidence when available.
  evidence_against:
  - No hepatic or alcohol-context support.
  contradiction_markers: []
  caveats:
  - Do not infer alcohol exposure from MCV or GGT alone.
  - Do not diagnose liver disease from this frame.
  confirmatory_tests: []
  missing_data_policy: Interpret only with the governed supporting markers and clinical
    context available on this panel.
  hypothesis_id: hyp_alcohol_or_hepatic_macrocytosis
  rank: 1
  title: Hepatic or alcohol-context macrocytosis differential
  physiological_claim: Raised MCV may occur with supportive liver markers and/or alcohol
    context, without inferring alcohol exposure or diagnosing liver disease from MCV
    or GGT alone.
  summary_template: Larger red cells can also occur in non-vitamin contexts, including
    liver, thyroid, alcohol or increased red-cell turnover patterns. The cause cannot
    be determined from MCV alone.
- evidence_strength: moderate
  evidence_for:
  - MCV elevated with cause-specific supporting evidence when present.
  evidence_against:
  - No cause-specific support beyond MCV.
  contradiction_markers: []
  caveats:
  - Do not diagnose hypothyroidism, haemolysis or marrow disease from MCV alone.
  - Marrow-dysplasia wording must remain cautious and clinician-facing.
  confirmatory_tests: []
  missing_data_policy: Interpret only with the governed supporting markers and clinical
    context available on this panel.
  hypothesis_id: hyp_other_nonmegaloblastic_macrocytosis
  rank: 2
  title: Other constrained non-megaloblastic macrocytosis differential
  physiological_claim: Non-megaloblastic macrocytosis may relate to reticulocytosis,
    hypothyroid physiology or other evidenced contexts; marrow-disorder language remains
    clinician-only and must not become an unrestricted catch-all.
  summary_template: Larger red cells can also occur in non-vitamin contexts, including
    liver, thyroid, alcohol or increased red-cell turnover patterns. The cause cannot
    be determined from MCV alone.
