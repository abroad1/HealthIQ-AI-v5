library:
  package_id: KBP-4725
  schema_version: 2.0.0
  package_version: 1.1.0
  library_name: ARCH-CONV-E — ALT High Muscle Source or Exertional Contribution
  description: Governed package asset translated from inv_alt_high_muscle_source_or_exertional_contribution
    in knowledge_bus/research/investigation_specs/multi_llm_research/ALT_High_Hepatic_Pattern_Classification_ARCH_CONV_E_Pass_3.json.
    Asset construction does not activate runtime authority.
signals:
- signal_id: signal_alt_high
  name: ALT High Muscle Source or Exertional Contribution
  description: Muscle injury, strenuous exercise, myopathy or rhabdomyolysis can contribute to ALT and
    AST elevation, particularly when CK is raised, so high CK should contextualise or downgrade liver-first
    interpretation.
  system: hepatic
  primary_metric: alt
  trigger_direction: high
  supporting_metrics:
  - biomarker_id: creatine_kinase
    expected_direction: high
    role: corroborator
    availability: common
    rationale: Raised CK supports skeletal-muscle contribution to aminotransferase elevation.
  - biomarker_id: ast
    expected_direction: high
    role: mechanism_marker
    availability: common
    rationale: AST is less liver-specific than ALT and can rise substantially with muscle injury.
  - biomarker_id: ggt
    expected_direction: any
    role: differential_marker
    availability: common
    rationale: GGT helps assess liver or biliary involvement; normal GGT can support but not prove a non-hepatic
      context.
  - biomarker_id: bilirubin
    expected_direction: any
    role: differential_marker
    availability: common
    rationale: Raised bilirubin is less consistent with isolated muscle-source aminotransferase elevation
      and should redirect toward clinical review.
  - biomarker_id: creatinine
    expected_direction: high
    role: severity_marker
    availability: common
    rationale: Creatinine can add renal-risk context when severe muscle injury or rhabdomyolysis is a
      concern.
  - biomarker_id: alp
    expected_direction: high
    role: differential_marker
    availability: common
    rationale: Raised ALP, particularly with raised GGT or bilirubin, supports liver or bile-flow context
      rather than isolated muscle contribution.
  dependencies:
    biomarkers:
    - alt
    - creatine_kinase
    - ast
    - ggt
    - bilirubin
    - creatinine
    - alp
    derived_metrics: []
    signals: []
  optional_dependencies:
    biomarkers: []
    derived_metrics: []
    signals: []
  thresholds: []
  activation_logic: lab_range_exceeded
  activation_config:
    enable_upper_bound: true
    upper_bound_state: suboptimal
    enable_lower_bound: false
    lower_bound_state: suboptimal
  override_rules:
  - rule_id: or_alt_high_with_ck_high_muscle_context
    resulting_state: at_risk
    description: Escalate or redirect interpretation when ALT elevation coincides with CK above the lab
      range because muscle contribution becomes plausible.
    conditions:
    - metric_id: creatine_kinase
      operator: '>'
      condition_type: all_of
      comparator_type: lab_range_boundary
      boundary: above_max
    source_refs:
    - source_pettersson_exercise_lft_2008
    - source_bodybuilding_aminotransferase_review_2020
    - source_rhabdomyolysis_lft_review_2020
  output:
    signal_value: alt
    signal_state: at_risk
    confidence: confidence_model_v1
    primary_metric: alt
    supporting_markers:
    - creatine_kinase
    - ast
    - ggt
    - bilirubin
    - creatinine
    - alp
  explanation:
    mechanism: ALT and AST can be released from skeletal muscle as well as liver, especially after strenuous
      exercise or muscle injury, and CK provides stronger muscle-source evidence.
    biological_pathway: Muscle membrane injury or exertional stress can raise CK, myoglobin and aminotransferases,
      creating a pattern that can mimic liver-enzyme elevation on routine panels.
    interpretation: HealthIQ may state that muscle contribution is possible when ALT elevation appears
      with high CK or recent heavy exercise, while clearly saying this does not exclude liver causes.
      Very high ALT values should be treated with escalated clinical-review wording regardless of a plausible
      muscle-source explanation.
    implications: The safest educational action is to place ALT in source-context rather than diagnosing
      liver disease or dismissing the liver, particularly if bilirubin, GGT or symptoms are present.
    supporting_marker_roles: CK corroborates muscle-source contribution; AST supports aminotransferase
      context; GGT and bilirubin contradict isolated muscle-source framing; creatinine adds renal-risk
      context if severe muscle injury is suspected.
