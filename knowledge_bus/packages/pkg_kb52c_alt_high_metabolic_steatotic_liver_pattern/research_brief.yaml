physiological_claim: High ALT can sit within metabolic liver risk context when metabolic markers or history
  support it, but MASLD diagnosis, steatosis and fibrosis staging require clinical assessment beyond ALT.
evidence_strength: strong
research_summary: 'Canonical ARCH-CONV-E Pass 3 promotion for spec_id=inv_alt_high_metabolic_masld_context;
  signal_id=signal_alt_high; contract=3.0.0. Hypotheses: hyp_metabolic_liver_context (rank 1, moderate):
  High ALT may be relevant to metabolic liver context when accompanied by metabolic risk markers or declared
  metabolic risk factors, but ALT alone cannot diagnose MASLD or stage fibrosis. | hyp_alt_high_metabolic_risk_needs_fibrosis_context
  (rank 2, strong): When ALT elevation appears with metabolic risk, the clinically important distinction
  is not just enzyme elevation but whether there is steatosis, fibrosis risk or another liver disease,
  which requires imaging, non-invasive fibrosis assessment or clinical workup. Missing-data boundaries:
  Do not emit MASLD or fatty liver claims if metabolic context, imaging or fibrosis-risk data are missing;
  use only general metabolic-context wording. | If imaging, FIB-4 inputs, elastography or clinician diagnosis
  are unavailable, avoid structural liver claims and do not stage disease. Contradiction and exclusion
  context: ctr_no_metabolic_context: Absent metabolic-risk markers or declared metabolic context weakens
  MASLD-context framing from ALT alone. | ctr_bilirubin_or_inr_acute_risk_context: Raised INR, or raised
  bilirubin where INR is unavailable, should redirect away from routine metabolic-context wording toward
  clinical-review severity context. | ctr_normal_triglycerides_reduces_metabolic_fibrosis_weight: A normal
  triglycerides reduces the metabolic burden supporting a significant MASLD-related fibrosis context,
  as metabolic-driven hepatic fibrosis is most associated with a compound dyslipidaemic and insulin-resistant
  metabolic profile; absence of hypertriglyceridaemia makes a high-risk metabolic fibrosis framing less
  compelling. | ctr_bilirubin_high_or_synthetic_context: Raised bilirubin or synthetic-function concern
  should redirect away from routine metabolic explanation. Non-diagnostic caveats: Liver enzymes can be
  normal in advanced MASLD and raised ALT is not diagnostic of MASLD. | Imaging or non-invasive fibrosis
  assessment is needed clinically for structural and fibrosis assessment. | Very high aminotransferase
  magnitude should prompt escalated clinical-review wording rather than being explained away by a plausible
  metabolic context alone. | ALT is not sufficiently sensitive or specific for MASLD severity or fibrosis.
  | HealthIQ should not imply that normal or mildly high ALT excludes advanced metabolic liver disease.
  | Very high aminotransferase magnitude should prompt escalated clinical-review wording rather than being
  explained away by a plausible metabolic context alone. Source limitations: Does not define R-value;
  supports context and safety boundaries. | US guideline; captured access through abstract-level source.
  | Not specific to isolated ALT-high consumer interpretation. | US NAFLD terminology; MASLD terminology
  evolving. Package research_brief biomarker-list limitation: hdl, inr are canonical source markers but
  are absent from the current SSOT biomarker registry; they remain preserved in signal-layer assets and
  are not activated.'
