library:
  package_id: KBP-4724
  schema_version: 2.0.0
  package_version: 1.1.0
  library_name: ARCH-CONV-E — ALT High Metabolic MASLD Context
  description: Governed package asset translated from inv_alt_high_metabolic_masld_context in knowledge_bus/research/investigation_specs/multi_llm_research/ALT_High_Hepatic_Pattern_Classification_ARCH_CONV_E_Pass_3.json.
    Asset construction does not activate runtime authority.
signals:
- signal_id: signal_alt_high
  name: ALT High Metabolic MASLD Context
  description: High ALT can sit within metabolic liver risk context when metabolic markers or history
    support it, but MASLD diagnosis, steatosis and fibrosis staging require clinical assessment beyond
    ALT.
  system: hepatic
  primary_metric: alt
  trigger_direction: high
  supporting_metrics:
  - biomarker_id: hba1c
    expected_direction: high
    role: corroborator
    availability: common
    rationale: Higher glycaemic exposure supports a metabolic-risk context that may be relevant to ALT
      elevation.
  - biomarker_id: triglycerides
    expected_direction: high
    role: mechanism_marker
    availability: common
    rationale: High triglycerides support insulin-resistant or metabolic dyslipidaemia context associated
      with MASLD risk.
  - biomarker_id: hdl
    expected_direction: low
    role: mechanism_marker
    availability: common
    rationale: Low HDL can support a broader metabolic-syndrome context when ALT is raised.
  - biomarker_id: ggt
    expected_direction: high
    role: corroborator
    availability: common
    rationale: GGT can be raised in metabolic liver contexts but is nonspecific.
  - biomarker_id: creatine_kinase
    expected_direction: high
    role: differential_marker
    availability: common
    rationale: High CK redirects away from a purely metabolic liver explanation and raises possible muscle
      contribution.
  - biomarker_id: bilirubin
    expected_direction: high
    role: severity_marker
    availability: common
    rationale: Raised bilirubin with ALT changes clinical concern and should redirect away from routine
      metabolic-context framing.
  - biomarker_id: inr
    expected_direction: high
    role: severity_marker
    availability: specialist
    rationale: A raised INR would indicate possible synthetic-function concern and should redirect away
      from routine metabolic-context wording.
  dependencies:
    biomarkers:
    - alt
    - hba1c
    - triglycerides
    - hdl
    - ggt
    - creatine_kinase
    - bilirubin
    - inr
    derived_metrics: []
    signals: []
  optional_dependencies:
    biomarkers: []
    derived_metrics: []
    signals: []
  thresholds: []
  activation_logic: lab_range_exceeded
  activation_config:
    enable_upper_bound: true
    upper_bound_state: suboptimal
    enable_lower_bound: false
    lower_bound_state: suboptimal
  # ARCH-CONV-E3: compound lab corroboration (any_of). Declared metabolic-risk user
  # context is blocked — no governed runtime context-modifier contract. Very-high-ALT
  # numeric suppress is blocked — no Pass 3 numeric threshold. Uses canonical
  # hdl_cholesterol id (hdl is an alias only).
  mandatory_pre_emission_gates:
  - gate_id: require_metabolic_lab_corroboration_any_of
    conditions:
    - metric_id: hba1c
      operator: '>'
      condition_type: any_of
      comparator_type: lab_range_boundary
      boundary: above_max
    - metric_id: triglycerides
      operator: '>'
      condition_type: any_of
      comparator_type: lab_range_boundary
      boundary: above_max
    - metric_id: ggt
      operator: '>'
      condition_type: any_of
      comparator_type: lab_range_boundary
      boundary: above_max
    - metric_id: hdl_cholesterol
      operator: '<'
      condition_type: any_of
      comparator_type: lab_range_boundary
      boundary: below_min
  override_rules:
  - rule_id: or_alt_high_with_metabolic_markers
    resulting_state: at_risk
    description: Escalate cautiously when ALT high coincides with metabolic-risk markers, while avoiding
      MASLD diagnosis.
    conditions:
    - metric_id: triglycerides
      operator: '>'
      condition_type: all_of
      comparator_type: lab_range_boundary
      boundary: above_max
    source_refs:
    - source_easl_masld_guideline_2024
    - source_aasld_nafld_guidance_2023
  - rule_id: or_alt_high_with_bilirubin_high
    resulting_state: at_risk
    description: Escalate severity context when raised bilirubin accompanies ALT; redirects away from
      routine metabolic framing. Consumer Hy's Law diagnosis is prohibited.
    conditions:
    - metric_id: bilirubin
      operator: '>'
      condition_type: all_of
      comparator_type: lab_range_boundary
      boundary: above_max
    presentation_safety:
      consumer_hys_law_diagnosis: PROHIBITED
      role: severity_escalation_not_cause_attribution
    source_refs:
    - source_bsg_abnormal_liver_tests_2017
    - source_acg_abnormal_liver_chemistries_2017
  output:
    signal_value: alt
    signal_state: at_risk
    confidence: confidence_model_v1
    primary_metric: alt
    supporting_markers:
    - hba1c
    - triglycerides
    - hdl
    - ggt
    - creatine_kinase
    - bilirubin
    - inr
  explanation:
    mechanism: Metabolic dysfunction can contribute to hepatic fat accumulation, inflammation and enzyme
      elevation, but ALT is an indirect and imperfect marker of this process.
    biological_pathway: Glycaemic exposure, insulin-resistant lipid patterns, adiposity and metabolic
      syndrome can interact with liver fat and inflammation, while imaging and fibrosis assessment are
      required for structural interpretation.
    interpretation: HealthIQ may explain that metabolic context can be relevant to raised ALT when supported
      by HbA1c, triglycerides, HDL or declared metabolic risk, without diagnosing MASLD or fatty liver.
      Very high ALT values should be treated with escalated clinical-review wording regardless of a plausible
      metabolic explanation.
    implications: The educational focus should be on context and clinician follow-up rather than disease
      labelling, especially where ALT elevation persists or other liver-risk markers are present.
    supporting_marker_roles: HbA1c, triglycerides and HDL support metabolic-risk context; GGT can corroborate
      liver-enzyme context; CK redirects toward muscle contribution; bilirubin redirects toward higher-concern
      clinical review.
