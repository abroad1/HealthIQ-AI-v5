library:
  package_id: KBP-4723
  schema_version: 2.0.0
  package_version: 1.1.0
  library_name: ARCH-CONV-E — ALT High R-Value Hepatocellular Biochemical Pattern
  description: Governed package asset translated from inv_alt_high_r_value_hepatocellular_biochemical_pattern
    in knowledge_bus/research/investigation_specs/multi_llm_research/ALT_High_Hepatic_Pattern_Classification_ARCH_CONV_E_Pass_3.json.
    Asset construction does not activate runtime authority.
signals:
- signal_id: signal_alt_high
  name: ALT High R-Value Hepatocellular Biochemical Pattern
  description: An ALT-predominant pattern can be classified biochemically when ALT is elevated out of
    proportion to ALP using lab-provided upper reference limits, but the pattern does not identify cause
    or severity.
  system: hepatic
  primary_metric: alt
  trigger_direction: high
  supporting_metrics:
  - biomarker_id: alp
    expected_direction: any
    role: differential_marker
    availability: common
    rationale: ALP is required with its lab upper reference limit to calculate the ALT-to-ALP R-value
      and distinguish ALT-predominant from mixed or ALP-predominant patterns.
  - biomarker_id: ast
    expected_direction: high
    role: corroborator
    availability: common
    rationale: AST elevation can corroborate an aminotransferase-predominant biochemical pattern but is
      less liver-specific than ALT.
  - biomarker_id: ggt
    expected_direction: any
    role: differential_marker
    availability: common
    rationale: GGT helps assess whether any ALP component is likely hepatic or biliary source, while remaining
      nonspecific.
  - biomarker_id: bilirubin
    expected_direction: high
    role: severity_marker
    availability: common
    rationale: Bilirubin elevation alongside ALT or AST adds excretory and severity context but does not
      identify the cause.
  - biomarker_id: creatine_kinase
    expected_direction: high
    role: differential_marker
    availability: common
    rationale: Raised CK can support muscle contribution to aminotransferase elevation and should downgrade
      a liver-first ALT interpretation.
  - biomarker_id: r_value_alt_alp
    expected_direction: high
    role: differential_marker
    availability: optional
    rationale: A high derived ALT-to-ALP R-value supports an ALT-predominant biochemical pattern when
      ALT and ALP upper reference limits are both available.
  dependencies:
    biomarkers:
    - alt
    - alp
    - ast
    - ggt
    - bilirubin
    - creatine_kinase
    derived_metrics:
    - r_value_alt_alp
    signals: []
  optional_dependencies:
    biomarkers: []
    derived_metrics: []
    signals: []
  thresholds: []
  activation_logic: lab_range_exceeded
  activation_config:
    enable_upper_bound: true
    upper_bound_state: suboptimal
    enable_lower_bound: false
    lower_bound_state: suboptimal
  # ARCH-CONV-E2/E3: emit on ALT lab-range elevation. Ranked Pass 3 hypotheses:
  # R >= 5 → hyp_alt_predominant_biochemical_pattern; missing/ineligible R-value →
  # hyp_alt_high_general_liver_test_abnormality_context. When 2 < R < 5 mixed owns
  # the band; when R <= 2 cholestatic owns the band (ARCH-CONV-E3).
  mandatory_pre_emission_gates: []
  override_rules:
  - rule_id: or_alt_high_with_bilirubin_high
    resulting_state: at_risk
    description: Escalate to at-risk wording when raised ALT coincides with raised bilirubin because bilirubin
      adds excretory and severity context. Severity escalation only — not cause attribution.
      Consumer Hy's Law diagnosis is prohibited.
    conditions:
    - metric_id: bilirubin
      operator: '>'
      condition_type: all_of
      comparator_type: lab_range_boundary
      boundary: above_max
    presentation_safety:
      consumer_hys_law_diagnosis: PROHIBITED
      role: severity_escalation_not_cause_attribution
      fractionation_unavailable: do_not_infer_conjugated_vs_unconjugated
      synthetic_function_markers: albumin_inr_add_context_when_present_do_not_invent
    source_refs:
    - source_fda_dili_guidance_2009
    - source_bsg_abnormal_liver_tests_2017
  - rule_id: or_alt_high_with_ck_high
    resulting_state: at_risk
    description: Redirect or downgrade liver-first wording when ALT elevation coincides with CK above
      the lab reference range.
    conditions:
    - metric_id: creatine_kinase
      operator: '>'
      condition_type: all_of
      comparator_type: lab_range_boundary
      boundary: above_max
    source_refs:
    - source_pettersson_exercise_lft_2008
    - source_bodybuilding_aminotransferase_review_2020
  output:
    signal_value: alt
    signal_state: at_risk
    confidence: confidence_model_v1
    primary_metric: alt
    supporting_markers:
    - alp
    - ast
    - ggt
    - bilirubin
    - creatine_kinase
    - r_value_alt_alp
  explanation:
    mechanism: ALT is an intracellular aminotransferase enriched in liver but not exclusive to liver tissue,
      so elevation reflects enzyme leakage or release rather than liver function.
    biological_pathway: The ALT-to-ALP relationship separates aminotransferase-predominant from ALP-predominant
      biochemical patterns, while bilirubin, GGT and CK provide severity, hepatic-source and muscle-source
      context.
    interpretation: When ALT is above the lab range and proportionally more raised than ALP, HealthIQ
      may describe an ALT-predominant biochemical pattern, while avoiding disease or injury confirmation.
    implications: This pattern may justify cautious clinician-review wording when accompanied by bilirubin,
      marked elevation, symptoms or persistence, but it cannot identify the underlying cause from one
      panel.
    supporting_marker_roles: ALP and its ULN support R-value classification; AST corroborates aminotransferase
      context; GGT and bilirubin add source and severity context; CK can redirect toward muscle contribution.
