derived_metrics:
- r_value_alt_alp
physiological_claim: An ALT-predominant pattern can be classified biochemically when ALT is elevated out
  of proportion to ALP using lab-provided upper reference limits, but the pattern does not identify cause
  or severity.
evidence_strength: consensus
research_summary: 'Canonical ARCH-CONV-E Pass 3 promotion for spec_id=inv_alt_high_r_value_hepatocellular_biochemical_pattern;
  signal_id=signal_alt_high; contract=3.0.0. Hypotheses: hyp_alt_predominant_biochemical_pattern (rank
  1, consensus): High ALT with proportionally lower ALP may support an ALT-predominant biochemical enzyme
  pattern when the R-value is at least 5 using same-sample ALT and ALP values. | hyp_alt_high_general_liver_test_abnormality_context
  (rank 2, strong): High ALT is a liver-enzyme abnormality that requires clinical-context review, previous
  results and companion liver markers before cause or duration can be inferred. Missing-data boundaries:
  Do not classify the R-value pattern if ALT ULN, ALP ULN or same-sample ALT/ALP pairing is unavailable.
  | If prior results, symptoms and medication/supplement history are missing, avoid cause and duration
  claims. Contradiction and exclusion context: ctr_ck_high_muscle_contribution: Raised CK or clear exertional/muscle
  context can explain aminotransferase elevation and should downgrade liver-first interpretation. | ctr_alp_or_ggt_biliary_component:
  A proportionally raised ALP or GGT component redirects away from a purely ALT-predominant pattern toward
  mixed or ALP-predominant interpretation. | ctr_ast_pattern_inconsistent_with_general_context: A markedly
  elevated or disproportionately high AST alongside elevated ALT challenges a routine general liver test
  abnormality framing and introduces concern for more significant hepatocellular involvement requiring
  clinical context beyond pattern classification alone. | ctr_bilirubin_or_synthetic_failure_context:
  Raised bilirubin or synthetic-function markers should move wording from routine education to clinician-review
  context. Non-diagnostic caveats: This classifies the enzyme pattern only and does not confirm hepatocellular
  damage, hepatitis, DILI, MASLD, alcohol-related disease or prognosis. | R-value evidence is strongest
  in suspected DILI classification and is commonly extrapolated to general liver-test patterning. | ALT
  magnitude alone is not a direct measure of liver function or prognosis. | A single commercial panel
  cannot reliably distinguish acute from chronic elevation. Source limitations: Educational page, not
  a formal practice guideline. | DILI-specific; general-liver-test use is extrapolative. | Premarketing/regulatory
  context, not consumer diagnostic guidance. | Does not define R-value; supports context and safety boundaries.
  | US guideline; captured access through abstract-level source. | Small healthy male cohort. | Bodybuilding/muscle-injury
  emphasis. Derived-metric contract: r_value_alt_alp = (ALT / ALT ULN) / (ALP / ALP ULN);
  ALT result and laboratory ULN, ALP result and laboratory ULN, and contemporaneous same-sample
  pairing are required; fail closed if any input is absent; classify this package only when R >= 5.'
